kind: pipeline
name: release

trigger:
  event:
    - tag

steps:
  - name: "Build Script"
    image: ubuntu
    pull: if-not-exists
    commands:
      - chmod +x ./utils/linac
      - mkdir build
      - ./utils/linac build axon.sh.build
      - mv build/axon.sh axon.sh

  - name: "Sign Release Artifacts"
    image: plugins/gpgsign
    settings:
      key:
        from_secret: gpg_key
      passphrase:
        from_secret: key_passphrase
      files:
        - axon.sh
      detach_sign: true

  - name: "Create Gitea Release"
    image: plugins/gitea-release
    settings:
      api_key:
        from_secret: api_key
      base_url: https://git.thisisjoes.site
      files:
        - axon.sh
        - axon.sh.asc
      checksum:
        - md5
        - sha256
      title: "${DRONE_TAG}"
      prerelease: false

---
kind: pipeline
name: tests

trigger:
  branch:
    - dev

steps:
  - name: "setup synapse"
    image: matrixdotorg/synapse:latest
    user: 991
    volumes:
      - name: data
        path: /data
    environment:
      SECRET:
        from_secret: shared_secret
    commands:
      - generate_config --generate-secrets --report-stats no --server-name synapse.thisisjoes.test --data-dir /data --config-dir /data --output-file /data/homeserver.yaml
      - 'sed -i "s/registration_shared_secret:.*/registration_shared_secret: \"$SECRET\"/g" /data/homeserver.yaml'
      - 'sed -i "s/\[''::1'', ''127.0.0.1''\]/\[''0.0.0.0''\]/g" /data/homeserver.yaml'

  - name: "synapse"
    image: matrixdotorg/synapse:latest
    user: 991
    volumes:
      - name: data
        path: /data
    detach: true

  - name: "create admin user"
    image: matrixdotorg/synapse:latest
    user: 991
    volumes:
      - name: data
        path: /data
    environment:
      PASSWORD:
        from_secret: admin_password
      SECRET:
        from_secret: shared_secret
    commands:
      - while ! curl --max-time 5  'http://synapse:8008/_matrix/static'; do sleep 1; done
      - register_new_matrix_user --admin --user admin --password "$PASSWORD" --shared-secret "$SECRET"

  - name: "run tests"
    image: bats/bats
    pull: if-not-exists
    commands:
      - apk --no-cache --update add jq curl
      - bats ./tests/functions

volumes:
  - name: data
    temp: {}
